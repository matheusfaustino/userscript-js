<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Chapter test — YouTube fixture</title>
    <style>
      body { margin: 0; background: #0f0f0f; }
      #movie_player {
        position: relative;
        width: 960px;
        height: 540px;
        background: #000;
      }
      #movie_player video { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <ytd-app></ytd-app>
    <div id="movie_player" class="html5-video-player">
      <video class="html5-main-video" muted playsinline></video>
    </div>

    <script>
      // Stands in for the YouTube player and app shell: no media is loaded, so
      // currentTime and duration are faked and every seek is recorded.
      const app = document.querySelector('ytd-app');
      const player = document.getElementById('movie_player');
      const video = player.querySelector('video');
      let time = 0;
      window.__seeks = [];

      Object.defineProperty(video, 'currentTime', {
        configurable: true,
        get: () => time,
        set: (value) => {
          time = value;
          window.__seeks.push(value);
          video.dispatchEvent(new Event('timeupdate'));
        },
      });
      Object.defineProperty(video, 'duration', { configurable: true, get: () => 120 });

      // Live page data lives on ytd-app and is refreshed on SPA navigation; the
      // player response does not carry chapter overlays.
      app.data = { response: null };
      player.getPlayerResponse = () => ({});

      // Build the same markersMap shape the watch page receives.
      window.setChapters = (chapters) => {
        window.__response = {
          playerOverlays: {
            playerOverlayRenderer: {
              decoratedPlayerBarRenderer: {
                decoratedPlayerBarRenderer: {
                  playerBar: {
                    multiMarkersPlayerBarRenderer: {
                      markersMap: [
                        { key: 'HEATMAP', value: { heatmap: [] } },
                        {
                          key: 'DESCRIPTION_CHAPTERS',
                          value: {
                            chapters: chapters.map((chapter) => ({
                              chapterRenderer: {
                                timeRangeStartMillis: chapter.start * 1000,
                                title: { simpleText: chapter.title },
                              },
                            })),
                          },
                        },
                      ],
                    },
                  },
                },
              },
            },
          },
        };
        app.data = { response: window.__response };
      };

      window.setChapters([
        { start: 0, title: 'INTRO' },
        { start: 43, title: 'Rivals of Aether' },
        { start: 85, title: 'Bloodstained: Curse of the Moon 2' },
      ]);
    </script>
  </body>
</html>
